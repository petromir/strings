name: Release

on:
  # Run only after the Build workflow succeeds on master. This gates every
  # release on a green build of the exact commit.
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]
  # Manual run:
  #   - no input picks up an already-merged Release PR.
  #   - a tag re-publishes an existing release (for example after a
  #     transient Maven Central failure).
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to re-publish (for example v0.1.0). Leave empty
          to run release-please.
        required: false
        type: string

# release-please must write the changelog and manifest, and create tags,
# releases, and pull requests.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never let two release runs overlap on the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # Automated runs start release-please only when Build succeeded on master.
    # A manual run skips release-please when a tag is given.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Configuration lives in release-please-config.json and
      # .release-please-manifest.json. The `java` strategy updates only
      # CHANGELOG.md and the manifest, never pom.xml.
      - name: Update the Release PR
        id: release
        # v4, pinned to a commit SHA because this third-party action can write
        # to the repository. Dependabot keeps the pin current.
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4

  publish:
    name: Publish to Maven Central
    needs: [release-please]
    # Publish when release-please created a release, or when a tag was given
    # manually. `!cancelled()` lets this run even though release-please is
    # skipped during a manual tag run.
    if: >-
      !cancelled()
      && (needs.release-please.outputs.release_created == 'true'
          || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Holds the deploy credentials and the required-reviewer gate.
    environment: maven-central
    permissions:
      # JReleaser attaches assets to the GitHub Release created by release-please.
      contents: write
    steps:
      # A manual tag run has no release-please output, so derive the version
      # from the tag (release tags use the `v<version>` format).
      - name: Resolve the release tag and version
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$tag" ]; then
            echo "No tag was given and release-please created no release." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VERSION:-${tag#v}}" >> "$GITHUB_OUTPUT"

      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          # JReleaser needs the full history and tags.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      # Set the version for this build only. It is never committed; the tag is
      # the single source of truth, and pom.xml on master stays -SNAPSHOT.
      - name: Set the Maven version for this build
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      # Fail fast if the release version cannot be published to Maven Central.
      # The plugin version comes from the pom.xml property.
      - name: Verify the release POM
        run: >-
          mvn --batch-mode --no-transfer-progress
          pomchecker:check-maven-central

      # Build and stage the release artifacts (main, sources, javadoc, pom) to a
      # local directory that JReleaser reads.
      - name: Build and stage the artifacts
        run: >-
          mvn --batch-mode --no-transfer-progress
          -DaltDeploymentRepository=local::file:./target/staging-deploy
          deploy

      # JReleaser (Maven plugin) signs the staged artifacts, publishes to
      # Maven Central, and attaches the built jars to the existing GitHub
      # Release. Version comes from the Maven project (set above).
      - name: Sign and publish
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.MAVEN_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          jreleaser:full-release

      # Keep the JReleaser logs when something goes wrong. The Maven plugin
      # writes to target/jreleaser.
      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-release
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties
